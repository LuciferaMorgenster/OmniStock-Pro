<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="box-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="box-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="box-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.3" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Background container with rounded corners (safe for square or circle cropping) -->
  <rect width="512" height="512" rx="108" fill="url(#bg-grad)" />

  <!-- Geometric Isometric Inventory Boxes Group -->
  <g transform="translate(256, 260) scale(1.1)" filter="url(#shadow)">
    <!-- Top Central Isometric Cube -->
    <g transform="translate(0, -60)">
      <!-- Top Face -->
      <polygon points="0,-48 64,-16 0,16 -64,-16" fill="url(#box-top)" />
      <!-- Left Face -->
      <polygon points="-64,-16 0,16 0,84 -64,52" fill="url(#box-left)" />
      <!-- Right Face -->
      <polygon points="0,16 64,-16 64,52 0,84" fill="url(#box-right)" />
      <!-- Box Seam Accent -->
      <line x1="0" y1="16" x2="0" y2="84" stroke="#475569" stroke-width="2" />
      <line x1="0" y1="-48" x2="0" y2="16" stroke="#cbd5e1" stroke-width="2" />
    </g>

    <!-- Bottom Left Isometric Cube -->
    <g transform="translate(-68, 50)">
      <polygon points="0,-48 64,-16 0,16 -64,-16" fill="url(#box-top)" />
      <polygon points="-64,-16 0,16 0,84 -64,52" fill="url(#box-left)" />
      <polygon points="0,16 64,-16 64,52 0,84" fill="url(#box-right)" />
    </g>

    <!-- Bottom Right Isometric Cube -->
    <g transform="translate(68, 50)">
      <polygon points="0,-48 64,-16 0,16 -64,-16" fill="url(#box-top)" />
      <polygon points="-64,-16 0,16 0,84 -64,52" fill="url(#box-left)" />
      <polygon points="0,16 64,-16 64,52 0,84" fill="url(#box-right)" />
    </g>

    <!-- Logistics Network Hub Accent Nodes -->
    <circle cx="0" cy="-60" r="8" fill="#38bdf8" />
    <circle cx="-68" cy="50" r="8" fill="#38bdf8" />
    <circle cx="68" cy="50" r="8" fill="#38bdf8" />
  </g>
</svg>
